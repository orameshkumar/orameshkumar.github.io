capture:
  mic_volume: 1.0
  microphone: true
  output_prefix: capture
  sample_rate: 16000
  system_audio: true
  system_volume: 1.1
chunk_duration_seconds: 300
dirs:
  audio: audio
  chunks: chunks
  output: output
keep_intermediate_files: false
language: auto
max_transcription_workers: 4
supported_extensions:
- .mp4
- .mkv
- .avi
- .mov
- .wmv
- .flv
- .webm
- .m4v
- .mpeg
- .mpg
- .mp3
- .wav
- .aac
- .flac
- .ogg
- .m4a
- .wma
whisper_model: base
