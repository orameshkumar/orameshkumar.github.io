<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Purple background -->
  <rect width="192" height="192" fill="#6200EE" rx="24"/>
  
  <!-- QR code hint - small squares in corner -->
  <rect x="20" y="20" width="24" height="24" fill="rgba(255,255,255,0.3)" rx="4"/>
  <rect x="20" y="20" width="10" height="10" fill="rgba(255,255,255,0.6)" rx="2"/>
  <rect x="148" y="20" width="24" height="24" fill="rgba(255,255,255,0.3)" rx="4"/>
  <rect x="162" y="20" width="10" height="10" fill="rgba(255,255,255,0.6)" rx="2"/>
  <rect x="20" y="148" width="24" height="24" fill="rgba(255,255,255,0.3)" rx="4"/>
  <rect x="20" y="162" width="10" height="10" fill="rgba(255,255,255,0.6)" rx="2"/>
  
  <!-- AR text -->
  <text x="96" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white">AR</text>
  
  <!-- Subtitle -->
  <text x="96" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)">QR Code</text>
</svg>
