<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reception — Clinic Queue</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand"><span class="dot"></span> <span data-clinic-name>Clinic Queue</span></div>
    <nav>
      <a href="reception.html" class="active">Reception</a>
      <a href="patients.html">Patients</a>
      <a href="billing.html">Billing</a>
      <a href="board.html">Queue Board</a>
      <a href="admin.html">Admin Setup</a>
    </nav>
    <div class="user-pill"><span id="user-email">—</span><button id="logout-btn">Sign out</button></div>
  </header>

  <main class="page">
    <div class="page-header">
      <h1>Reception desk</h1>
      <p>Register patients, issue tokens, capture intake vitals, and collect fees.</p>
    </div>

    <div class="grid-2">
      <!-- LEFT: Patient lookup / registration / token issuance -->
      <div class="card">
        <h2>Find or register a patient</h2>
        <div class="field">
          <label for="search-input">Mobile number, Patient ID, or name</label>
          <div style="display:flex;gap:0.5rem;">
            <input id="search-input" placeholder="Start typing to search…" style="flex:1;" />
            <div id="scan-btn-container"></div>
          </div>
        </div>
        <div id="search-results"></div>

        <hr class="section-divider" />

        <form id="patient-form">
          <p class="small muted" id="form-mode-label">New patient details</p>
          <input type="hidden" id="patient-id" />
          <div class="field-row">
            <div class="field"><label for="p-name">Full name</label><input id="p-name" required /></div>
            <div class="field"><label for="p-mobile">Mobile number</label><input id="p-mobile" required /></div>
          </div>
          <div class="field-row">
            <div class="field"><label for="p-age">Age</label><input id="p-age" type="number" min="0" required /></div>
            <div class="field">
              <label for="p-gender">Gender</label>
              <select id="p-gender" required>
                <option value="">Select</option>
                <option>Male</option><option>Female</option><option>Other</option>
              </select>
            </div>
          </div>
          <div class="field"><label for="p-address">Address</label><input id="p-address" /></div>

          <div class="flex-between" id="patient-edit-actions" style="display:none;margin-bottom:1rem;">
            <button type="button" class="btn btn-sm btn-outline" id="print-card-btn-reception">Print patient card</button>
            <button type="button" class="btn btn-sm btn-outline" id="save-patient-only-btn">Save details (no token)</button>
            <button type="button" class="btn btn-sm btn-danger" id="delete-patient-only-btn">Delete patient</button>
          </div>

          <hr class="section-divider" />

          <label>Preferred doctor(s) — patient will be served by whichever is free first</label>
          <div class="checkbox-group" id="doctor-checkboxes"></div>
          <p class="helper" id="availability-helper"></p>
          <div id="overcapacity-warning"></div>

          <button class="btn btn-primary btn-block" type="submit" style="margin-top:1rem;">Issue token</button>
        </form>
      </div>

      <!-- RIGHT: Today's tokens at this desk + vitals + billing -->
      <div class="card">
        <h2>Today's tokens</h2>
        <div id="today-tokens"><div class="empty-state">No tokens issued yet today.</div></div>
      </div>
    </div>
  </main>
</div>

<!-- Vitals modal -->
<div id="vitals-modal" style="display:none;position:fixed;inset:0;background:rgba(28,36,34,0.55);z-index:100;align-items:center;justify-content:center;">
  <div class="card" style="max-width:420px;width:90%;">
    <h2>Intake vitals — <span id="vitals-token"></span></h2>
    <div class="field-row">
      <div class="field"><label>Weight (kg)</label><input id="v-weight" type="number" /></div>
      <div class="field"><label>Temp (°F)</label><input id="v-temp" type="number" step="0.1" /></div>
    </div>
    <div class="field-row">
      <div class="field"><label>BP Systolic</label><input id="v-bp-sys" type="number" /></div>
      <div class="field"><label>BP Diastolic</label><input id="v-bp-dia" type="number" /></div>
    </div>
    <div class="field"><label>Chief complaint / reason for visit</label><textarea id="v-complaint" rows="2"></textarea></div>
    <div class="field"><label>Already consulted notes (referrals etc.)</label><textarea id="v-prior" rows="2"></textarea></div>
    <div class="flex-between">
      <button class="btn btn-outline" id="vitals-cancel">Cancel</button>
      <button class="btn btn-primary" id="vitals-save">Save vitals</button>
    </div>
  </div>
</div>

<!-- Billing modal -->
<div id="billing-modal" style="display:none;position:fixed;inset:0;background:rgba(28,36,34,0.55);z-index:100;align-items:center;justify-content:center;">
  <div class="card" style="max-width:420px;width:90%;">
    <h2>Collect fee — <span id="billing-token"></span></h2>
    <div class="field"><label>Consultation fee (₹)</label><input id="b-consult-fee" type="number" /></div>
    <div class="field"><label>Medicine / pharmacy fee (₹)</label><input id="b-med-fee" type="number" value="0" /></div>
    <div class="field"><label>Other charges (₹)</label><input id="b-other-fee" type="number" value="0" /></div>
    <div class="field">
      <label>Payment mode</label>
      <select id="b-mode"><option>Cash</option><option>Card</option><option>UPI</option><option>Other</option></select>
    </div>
    <p class="flex-between"><strong>Total</strong> <strong id="b-total">₹0</strong></p>
    <div class="flex-between">
      <button class="btn btn-outline" id="billing-cancel">Cancel</button>
      <button class="btn btn-primary" id="billing-save">Collect &amp; receipt</button>
    </div>
  </div>
</div>

<script type="module">
import {
  auth, authReady, db, onAuthStateChanged, signOut,
  collection, addDoc, doc, updateDoc, deleteDoc, getDoc, getDocs, onSnapshot,
  query, where, orderBy
} from "./js/firebase-config.js";
import { computeACT, calculateETAs, formatETA, todayKey, STATUS_LABELS, NO_SHOW_GRACE_SECONDS, generatePatientId, applyClinicBranding } from "./js/queue-logic.js";
import { attachScanButton } from "./js/barcode-scanner.js";

applyClinicBranding();
await authReady;

document.getElementById("scan-btn-container").appendChild(attachScanButton(document.getElementById("search-input")));

onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.href = "index.html"; return; }
  document.getElementById("user-email").textContent = user.email;
});
document.getElementById("logout-btn").onclick = () => signOut(auth).then(() => window.location.href = "index.html");

const doctorsRef = collection(db, "doctors");
const patientsRef = collection(db, "patients");
const visitsRef = collection(db, "visits");

let doctors = [];
let selectedDoctorIds = new Set();
let actCache = {};

// Load doctors + render checkboxes
onSnapshot(doctorsRef, async (snap) => {
  doctors = [];
  snap.forEach((d) => doctors.push({ id: d.id, ...d.data() }));
  renderDoctorCheckboxes(); // render immediately so the UI never blocks on ACT lookups
  for (const doc_ of doctors) {
    try {
      actCache[doc_.id] = await computeACT(doc_.id);
    } catch (err) {
      console.error("computeACT failed for doctor", doc_.id, err);
      actCache[doc_.id] = (doc_.seedActMinutes || 8) * 60; // fall back to seed value
    }
  }
});

function renderDoctorCheckboxes() {
  const box = document.getElementById("doctor-checkboxes");
  if (doctors.length === 0) {
    box.innerHTML = '<p class="helper">No doctors configured yet. Add one in Admin Setup.</p>';
    return;
  }
  box.innerHTML = doctors.map((d) => `
    <label class="checkbox-chip ${selectedDoctorIds.has(d.id) ? "checked" : ""}" data-doc="${d.id}">
      <input type="checkbox" value="${d.id}" ${selectedDoctorIds.has(d.id) ? "checked" : ""} />
      ${escapeHtml(d.name)}
    </label>`).join("");
  box.querySelectorAll(".checkbox-chip").forEach((chip) => {
    chip.addEventListener("click", (e) => {
      e.preventDefault();
      const id = chip.dataset.doc;
      if (selectedDoctorIds.has(id)) selectedDoctorIds.delete(id); else selectedDoctorIds.add(id);
      renderDoctorCheckboxes();
      updateAvailabilityHelper();
    });
  });
  updateAvailabilityHelper();
}

async function updateAvailabilityHelper() {
  const helper = document.getElementById("availability-helper");
  const warnBox = document.getElementById("overcapacity-warning");
  warnBox.innerHTML = "";
  if (selectedDoctorIds.size === 0) { helper.textContent = ""; return; }

  const lines = [];
  let anyWarning = false;
  for (const id of selectedDoctorIds) {
    const d = doctors.find((x) => x.id === id);
    const waitingCount = await countWaiting(id);
    const act = actCache[id] || d.seedActMinutes * 60;
    const etaMinutes = Math.round((waitingCount * act) / 60);
    lines.push(`${d.name}: ${waitingCount} ahead, ~${etaMinutes} min wait`);
    // Simple availability check placeholder — full calendar windows can be added later;
    // for now we warn if estimated wait exceeds a configurable session length proxy (120 min).
    if (etaMinutes > 120) anyWarning = true;
  }
  helper.textContent = lines.join("  ·  ");
  if (anyWarning) {
    warnBox.innerHTML = `<div class="warning-box">⚠️ <div><strong>Estimated wait is long</strong>The expected consultation time may fall outside this doctor's remaining availability today. You can still issue the token if the patient agrees to wait.</div></div>`;
  }
}

async function countWaiting(doctorId) {
  const q = query(visitsRef, where("visitDate", "==", todayKey()), where("status", "in", ["waiting", "called"]));
  const snap = await getDocs(q);
  let count = 0;
  snap.forEach((d) => {
    const v = d.data();
    if (v.doctorId === doctorId || (v.preferredDoctorIds || []).includes(doctorId)) count++;
  });
  return count;
}

// ----- Patient search -----
let searchTimeout;
document.getElementById("search-input").addEventListener("input", (e) => {
  clearTimeout(searchTimeout);
  const term = e.target.value.trim();
  if (term.length < 2) { document.getElementById("search-results").innerHTML = ""; return; }
  searchTimeout = setTimeout(() => doSearch(term), 250);
});

async function doSearch(term) {
  const snap = await getDocs(patientsRef);
  const results = [];
  snap.forEach((d) => {
    const p = { id: d.id, ...d.data() };
    if (p.deletedAt) return; // hidden via soft-delete — don't surface in active search
    const hay = `${p.name} ${p.mobile} ${p.id} ${p.patientCode || ""}`.toLowerCase();
    if (hay.includes(term.toLowerCase())) results.push(p);
  });
  const box = document.getElementById("search-results");
  if (results.length === 0) { box.innerHTML = '<p class="helper">No match — fill the form below to register a new patient.</p>'; return; }
  box.innerHTML = results.slice(0, 5).map((p) => `
    <div class="flex-between" style="padding:0.5rem 0;border-bottom:1px solid var(--paper-dim);cursor:pointer;" data-pick="${p.id}">
      <span><strong>${escapeHtml(p.name)}</strong> · ${p.age}/${p.gender} · ${escapeHtml(p.mobile)} <span class="small muted">· ${p.patientCode || "no ID yet"}</span></span>
      <span class="small muted">Select</span>
    </div>`).join("");
  box.querySelectorAll("[data-pick]").forEach((row) => {
    row.addEventListener("click", () => fillPatientForm(results.find((p) => p.id === row.dataset.pick)));
  });
}

function fillPatientForm(p) {
  document.getElementById("patient-id").value = p.id;
  document.getElementById("p-name").value = p.name;
  document.getElementById("p-mobile").value = p.mobile;
  document.getElementById("p-age").value = p.age;
  document.getElementById("p-gender").value = p.gender;
  document.getElementById("p-address").value = p.address || "";
  const registeredStr = p.registeredAt ? new Date(p.registeredAt).toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" }) : "unknown date";
  document.getElementById("form-mode-label").textContent = `Editing existing patient — ID: ${p.patientCode || "(legacy, no ID)"} · Registered ${registeredStr}`;
  document.getElementById("patient-edit-actions").style.display = "flex";
}

function clearPatientForm() {
  document.getElementById("patient-form").reset();
  document.getElementById("patient-id").value = "";
  document.getElementById("form-mode-label").textContent = "New patient details";
  document.getElementById("patient-edit-actions").style.display = "none";
  document.getElementById("search-results").innerHTML = "";
}

function currentPatientFormData() {
  return {
    name: document.getElementById("p-name").value.trim(),
    mobile: document.getElementById("p-mobile").value.trim(),
    age: Number(document.getElementById("p-age").value),
    gender: document.getElementById("p-gender").value,
    address: document.getElementById("p-address").value.trim(),
  };
}

document.getElementById("print-card-btn-reception").addEventListener("click", () => {
  const patientId = document.getElementById("patient-id").value;
  if (!patientId) return;
  window.open(`patient-card.html?id=${encodeURIComponent(patientId)}`, "_blank");
});

document.getElementById("save-patient-only-btn").addEventListener("click", async () => {
  const patientId = document.getElementById("patient-id").value;
  if (!patientId) return;
  const data = currentPatientFormData();
  if (!data.name || !data.mobile) { alert("Name and mobile number are required."); return; }
  await updateDoc(doc(db, "patients", patientId), data);
  alert("Patient details updated.");
  clearPatientForm();
});

document.getElementById("delete-patient-only-btn").addEventListener("click", async () => {
  const patientId = document.getElementById("patient-id").value;
  const name = document.getElementById("p-name").value;
  if (!patientId) return;
  const choice = prompt(
    `Delete ${name}?\n\nType "hide" to soft-delete — removes them from search/listings but keeps all visit and billing history intact.\n\nType "delete" to permanently remove this patient record. Their past visits/bills remain in reports but lose their live patient link. This cannot be undone.\n\nType anything else to cancel.`
  );
  if (choice === "hide") {
    await updateDoc(doc(db, "patients", patientId), { deletedAt: new Date().toISOString() });
    alert("Patient hidden. Visit history preserved.");
    clearPatientForm();
  } else if (choice === "delete") {
    if (!confirm(`This permanently deletes ${name}'s patient record and cannot be undone. Continue?`)) return;
    await deleteDoc(doc(db, "patients", patientId));
    alert("Patient record permanently deleted.");
    clearPatientForm();
  }
});

// ----- Token issuance -----
document.getElementById("patient-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (selectedDoctorIds.size === 0) { alert("Select at least one preferred doctor."); return; }

  const existingId = document.getElementById("patient-id").value;
  const patientData = {
    name: document.getElementById("p-name").value.trim(),
    mobile: document.getElementById("p-mobile").value.trim(),
    age: Number(document.getElementById("p-age").value),
    gender: document.getElementById("p-gender").value,
    address: document.getElementById("p-address").value.trim(),
    registrationSource: "reception",
  };

  let patientId = existingId;
  let patientCode;
  if (!patientId) {
    patientCode = await generatePatientId();
    const newDoc = await addDoc(patientsRef, { ...patientData, patientCode, registeredAt: new Date().toISOString() });
    patientId = newDoc.id;
  } else {
    const existingSnap = await getDoc(doc(db, "patients", patientId));
    patientCode = existingSnap.exists() ? existingSnap.data().patientCode : null;
    // Persist any edits made to this existing patient's details (name/mobile/age/gender/address)
    // before issuing a token — previously these edits were silently discarded.
    await updateDoc(doc(db, "patients", patientId), patientData);
  }

  const preferredDoctorIds = Array.from(selectedDoctorIds);
  const tokenNumber = await nextTokenNumber(preferredDoctorIds[0]);

  await addDoc(visitsRef, {
    patientId,
    patientCode: patientCode || null,
    patientName: patientData.name,
    patientAge: patientData.age,
    patientGender: patientData.gender,
    preferredDoctorIds,
    doctorId: null, // set once a doctor actually calls it
    tokenNumber,
    queueSequence: tokenNumber, // separate from tokenNumber so a patient can be reordered ("send to end of queue") without changing their printed/displayed token number — see moveToEndOfQueue()
    status: "waiting",
    source: "reception",
    visitDate: todayKey(),
    overCapacityWarningAcknowledged: document.getElementById("overcapacity-warning").innerHTML.includes("warning-box"),
    issuedAt: new Date().toISOString(),
    vitals: null,
    fees: null,
  });

  alert(`Token #${tokenNumber} issued for ${patientData.name}.\nPatient ID: ${patientCode || "(existing patient, no ID on record)"}`);
  clearPatientForm();
  selectedDoctorIds.clear();
  renderDoctorCheckboxes();
});

async function nextTokenNumber(doctorId) {
  const q = query(visitsRef, where("visitDate", "==", todayKey()), where("doctorId", "==", doctorId));
  const snap = await getDocs(q);
  // Also count tokens still pending across preferences for this doctor (doctorId null but listed as preferred)
  const allToday = await getDocs(query(visitsRef, where("visitDate", "==", todayKey())));
  let max = 0;
  allToday.forEach((d) => {
    const v = d.data();
    if (v.doctorId === doctorId || (v.preferredDoctorIds || []).includes(doctorId)) {
      if (v.tokenNumber > max) max = v.tokenNumber;
    }
  });
  return max + 1;
}

// ----- Today's tokens list with vitals/billing actions -----
let activeVitalsVisitId = null;
let activeBillingVisitId = null;

onSnapshot(query(visitsRef, where("visitDate", "==", todayKey()), orderBy("tokenNumber")), (snap) => {
  const list = document.getElementById("today-tokens");
  if (snap.empty) { list.innerHTML = '<div class="empty-state">No tokens issued yet today.</div>'; return; }
  let html = "<table><thead><tr><th>Token</th><th>Patient</th><th>Patient ID</th><th>Doctor(s)</th><th>Status</th><th>Actions</th></tr></thead><tbody>";
  snap.forEach((d) => {
    const v = { id: d.id, ...d.data() };
    const docNames = (v.preferredDoctorIds || []).map((id) => doctors.find((x) => x.id === id)?.name || "—").join(", ");
    html += `<tr>
      <td><span class="token-tag">#${v.tokenNumber}</span></td>
      <td>${escapeHtml(v.patientName)}<br/><span class="small muted">${v.patientAge}/${v.patientGender}</span></td>
      <td class="small">${v.patientCode || "—"}</td>
      <td class="small">${docNames}</td>
      <td><span class="badge badge-${v.status}">${STATUS_LABELS[v.status] || v.status}</span></td>
      <td>
        ${v.status === "waiting" ? `<button class="btn btn-sm ${v.vitals ? "btn-vitals-done" : "btn-vitals-pending"}" data-visit='${escapeHtmlAttr(JSON.stringify(v))}'>${v.vitals ? "✓ Vitals" : "Add vitals"}</button> <button class="btn btn-sm btn-outline" data-move-end='${escapeHtmlAttr(JSON.stringify(v))}'>Move to end</button> <button class="btn btn-sm btn-danger" data-cancel="${v.id}">Cancel</button>` : ""}
        ${v.status === "completed" && !v.fees ? `<button class="btn btn-sm btn-amber" data-bill="${v.id}" data-fee="${docFeeFor(v)}">Collect fee</button>` : ""}
        ${v.fees ? `<span class="small muted">Paid ₹${v.fees.total}</span>` : ""}
      </td>
    </tr>`;
  });
  html += "</tbody></table>";
  list.innerHTML = html;

  list.querySelectorAll("[data-visit]").forEach((b) => b.addEventListener("click", () => openVitals(JSON.parse(b.getAttribute("data-visit")))));
  list.querySelectorAll("[data-move-end]").forEach((b) => b.addEventListener("click", () => moveToEndOfQueue(JSON.parse(b.getAttribute("data-move-end")))));
  list.querySelectorAll("[data-cancel]").forEach((b) => b.addEventListener("click", () => cancelToken(b.dataset.cancel)));
  list.querySelectorAll("[data-bill]").forEach((b) => b.addEventListener("click", () => openBilling(b.dataset.bill, Number(b.dataset.fee))));
});

function docFeeFor(v) {
  const id = v.doctorId || (v.preferredDoctorIds || [])[0];
  return doctors.find((d) => d.id === id)?.consultationFee || 0;
}

async function cancelToken(visitId) {
  if (!confirm("Cancel this token?")) return;
  await updateDoc(doc(db, "visits", visitId), { status: "cancelled", cancelledAt: new Date().toISOString() });
}

async function moveToEndOfQueue(visit) {
  if (!confirm(`Move token #${visit.tokenNumber} (${visit.patientName}) to the end of the queue? Their token number stays the same — only their position in line changes.`)) return;

  // Find the current highest queueSequence among Waiting tokens for the same doctor(s)
  // this token is eligible for, and place this token just behind it.
  const relevantDoctorIds = visit.preferredDoctorIds && visit.preferredDoctorIds.length > 0
    ? visit.preferredDoctorIds
    : [visit.doctorId];

  const todaySnap = await getDocs(query(visitsRef, where("visitDate", "==", todayKey()), where("status", "==", "waiting")));
  let maxSeq = visit.queueSequence || visit.tokenNumber;
  todaySnap.forEach((d) => {
    const other = d.data();
    if (d.id === visit.id) return;
    const sharesADoctor = (other.preferredDoctorIds || []).some((id) => relevantDoctorIds.includes(id)) || relevantDoctorIds.includes(other.doctorId);
    if (sharesADoctor) {
      const seq = other.queueSequence ?? other.tokenNumber;
      if (seq > maxSeq) maxSeq = seq;
    }
  });

  await updateDoc(doc(db, "visits", visit.id), { queueSequence: maxSeq + 1 });
}

function openVitals(visit) {
  activeVitalsVisitId = visit.id;
  document.getElementById("vitals-token").textContent = `#${visit.tokenNumber} — ${visit.patientName}`;
  const existing = visit.vitals || {};
  document.getElementById("v-weight").value = existing.weight || "";
  document.getElementById("v-temp").value = existing.temperature || "";
  document.getElementById("v-bp-sys").value = existing.bpSystolic || "";
  document.getElementById("v-bp-dia").value = existing.bpDiastolic || "";
  document.getElementById("v-complaint").value = existing.chiefComplaint || "";
  document.getElementById("v-prior").value = existing.priorNotes || "";
  document.getElementById("vitals-modal").style.display = "flex";
}
document.getElementById("vitals-cancel").onclick = () => document.getElementById("vitals-modal").style.display = "none";
document.getElementById("vitals-save").onclick = async () => {
  await updateDoc(doc(db, "visits", activeVitalsVisitId), {
    vitals: {
      weight: document.getElementById("v-weight").value,
      temperature: document.getElementById("v-temp").value,
      bpSystolic: document.getElementById("v-bp-sys").value,
      bpDiastolic: document.getElementById("v-bp-dia").value,
      chiefComplaint: document.getElementById("v-complaint").value,
      priorNotes: document.getElementById("v-prior").value,
      capturedAt: new Date().toISOString(),
    }
  });
  document.getElementById("vitals-modal").style.display = "none";
};

function openBilling(visitId, defaultFee) {
  activeBillingVisitId = visitId;
  document.getElementById("billing-token").textContent = "visit";
  document.getElementById("b-consult-fee").value = defaultFee;
  document.getElementById("b-med-fee").value = 0;
  document.getElementById("b-other-fee").value = 0;
  updateTotal();
  document.getElementById("billing-modal").style.display = "flex";
}
["b-consult-fee","b-med-fee","b-other-fee"].forEach((id) => document.getElementById(id).addEventListener("input", updateTotal));
function updateTotal() {
  const total = Number(document.getElementById("b-consult-fee").value || 0)
    + Number(document.getElementById("b-med-fee").value || 0)
    + Number(document.getElementById("b-other-fee").value || 0);
  document.getElementById("b-total").textContent = `₹${total}`;
}
document.getElementById("billing-cancel").onclick = () => document.getElementById("billing-modal").style.display = "none";
document.getElementById("billing-save").onclick = async () => {
  const consultationFee = Number(document.getElementById("b-consult-fee").value || 0);
  const medicineFee = Number(document.getElementById("b-med-fee").value || 0);
  const otherFee = Number(document.getElementById("b-other-fee").value || 0);
  const total = consultationFee + medicineFee + otherFee;
  const mode = document.getElementById("b-mode").value;
  await updateDoc(doc(db, "visits", activeBillingVisitId), {
    fees: { consultationFee, medicineFee, otherFee, total, mode, collectedAt: new Date().toISOString(), receiptNumber: `RCPT-${Date.now()}` }
  });
  document.getElementById("billing-modal").style.display = "none";
  alert(`Receipt generated. Total collected: ₹${total} via ${mode}.`);
};

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function escapeHtmlAttr(s) {
