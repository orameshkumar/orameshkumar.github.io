  <rect x="266" y="176" width="230" height="68" rx="6" fill="#D32F2F" stroke="#8B1A1A" stroke-width="2"/>
  <!-- Row 4 (offset) -->
  <rect x="16" y="256" width="110" height="68" rx="6" fill="#D32F2F" stroke="#8B1A1A" stroke-width="2"/>
