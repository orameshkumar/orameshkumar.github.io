  <path d="M 115 110 Q 230 110 230 180 Q 230 250 115 250" stroke="#607D8B" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path d="M 115 250 Q 240 250 240 330 Q 240 400 115 400" stroke="#607D8B" stroke-width="26" stroke-linecap="round" fill="none"/>
