  <line x1="105" y1="165" x2="125" y2="155" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <line x1="105" y1="195" x2="125" y2="185" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <line x1="105" y1="225" x2="125" y2="215" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <line x1="105" y1="275" x2="125" y2="265" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <line x1="105" y1="305" x2="125" y2="295" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <line x1="105" y1="335" x2="125" y2="325" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
