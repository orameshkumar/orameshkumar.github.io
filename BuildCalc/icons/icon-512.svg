  <path d="M 115 110 Q 225 110 225 180 Q 225 248 115 250" stroke="#B0BEC5" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.3"/>
  <path d="M 115 250 Q 235 250 235 330 Q 235 398 115 400" stroke="#B0BEC5" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- Letter C - Threaded steel rebar -->
  <path d="M 400 120 Q 280 100 280 256 Q 280 415 400 395" stroke="#607D8B" stroke-width="26" stroke-linecap="round" fill="none"/>
  <!-- C rebar ridges -->
