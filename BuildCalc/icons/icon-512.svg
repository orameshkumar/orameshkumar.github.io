  <rect x="380" y="256" width="116" height="68" rx="6" fill="#D32F2F" stroke="#8B1A1A" stroke-width="2"/>
  <!-- Row 5 -->
  <rect x="16" y="336" width="230" height="68" rx="6" fill="#C62828" stroke="#8B1A1A" stroke-width="2"/>
  <rect x="258" y="336" width="238" height="68" rx="6" fill="#D32F2F" stroke="#8B1A1A" stroke-width="2"/>
  <!-- Row 6 (offset) -->
  <rect x="16" y="416" width="110" height="68" rx="6" fill="#D32F2F" stroke="#8B1A1A" stroke-width="2"/>
  <rect x="138" y="416" width="230" height="68" rx="6" fill="#C62828" stroke="#8B1A1A" stroke-width="2"/>
  <rect x="380" y="416" width="116" height="68" rx="6" fill="#D32F2F" stroke="#8B1A1A" stroke-width="2"/>

