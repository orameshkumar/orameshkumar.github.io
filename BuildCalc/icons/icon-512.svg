<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="72" fill="#8D6E63"/>
  
  <!-- Brick wall pattern - 6 rows -->
