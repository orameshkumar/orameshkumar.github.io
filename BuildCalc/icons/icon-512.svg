  <line x1="330" y1="130" x2="325" y2="118" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <line x1="298" y1="160" x2="288" y2="150" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <line x1="285" y1="200" x2="275" y2="192" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <line x1="282" y1="240" x2="272" y2="234" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <line x1="282" y1="280" x2="272" y2="274" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <line x1="285" y1="320" x2="275" y2="314" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <line x1="298" y1="355" x2="288" y2="348" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <line x1="330" y1="382" x2="325" y2="372" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <line x1="385" y1="393" x2="400" y2="386" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <!-- C highlight -->
  <path d="M 398 122 Q 286 104 286 256 Q 286 412 398 393" stroke="#B0BEC5" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.35"/>
