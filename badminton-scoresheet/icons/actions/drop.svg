<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Drop: Shuttlecock dropping gently over net -->
  <circle cx="16" cy="8" r="2.5" fill="#A5D6A7" stroke="#4CAF50" stroke-width="1.5"/>
  <!-- Curved drop path -->
  <path d="M16 10.5 Q18 16 16 22" fill="none" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="2,2"/>
  <!-- Net -->
  <line x1="4" y1="20" x2="28" y2="20" stroke="#66BB6A" stroke-width="1.5"/>
  <line x1="4" y1="22" x2="28" y2="22" stroke="#66BB6A" stroke-width="1"/>
  <line x1="10" y1="20" x2="10" y2="22" stroke="#66BB6A" stroke-width="1"/>
  <line x1="16" y1="20" x2="16" y2="22" stroke="#66BB6A" stroke-width="1"/>
  <line x1="22" y1="20" x2="22" y2="22" stroke="#66BB6A" stroke-width="1"/>
  <!-- Landing point -->
  <circle cx="16" cy="27" r="2" fill="none" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="2,1.5"/>
</svg>
